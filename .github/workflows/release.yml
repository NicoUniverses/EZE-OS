name: release
# Publishes a GitHub release with the wheel and sdist whenever the version in
# pyproject.toml changes on main (and re-attaches files to manually published releases).
on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build pytest
      - run: python -m pytest -q
      - run: python -m build
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            NOTES=$(python scripts/release_notes.py "$VERSION")
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "EZE OS $VERSION" --notes "$NOTES" --prerelease
          fi
